name: Job Attempt State Machine Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  statemachine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Run job attempt state machine tests
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
        run: go test ./internal/db/ -run TestJobAttemptStateMachine -count=1 -v
